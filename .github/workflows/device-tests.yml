name: Device tests

# Unit tests on the JVM, then the full instrumented suite (copy engine + screens) on Android
# emulators. Results, screenshots and logs are published as a pre-release per API level:
# https://github.com/<owner>/<repo>/releases/tag/test-results-api34

# Runs only when started by hand: Actions → Device tests → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]   # Android 11 and Android 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --continue 2>&1 | tee unit-output.txt || echo "UNIT_FAILED=1" >> "$GITHUB_ENV"

      - name: Build app and test APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee build-output.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-tests.sh

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ matrix.api }}
        run: bash .github/scripts/publish-test-results.sh

      - name: Fail if unit tests failed
        if: env.UNIT_FAILED == '1'
        run: exit 1
