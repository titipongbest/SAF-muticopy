name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SAF-MultiCopy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAF-MultiCopy
          path: SAF-MultiCopy.apk

      # Download link that always points to the newest build:
      # https://github.com/<owner>/<repo>/releases/download/latest/SAF-MultiCopy.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SAF-MultiCopy.apk \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built automatically from main. Open this page on your phone, tap SAF-MultiCopy.apk, then install." \
            --target "$GITHUB_SHA" \
            --latest
