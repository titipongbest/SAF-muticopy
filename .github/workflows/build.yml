name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The release key lives only in repository secrets (Settings → Secrets and variables → Actions).
      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Release key secrets are missing — add RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD (see README, Signing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SAF-MultiCopy.apk
          echo "Signing certificate:"
          keytool -printcert -jarfile SAF-MultiCopy.apk | grep -E "Owner|SHA256"

      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: SAF-MultiCopy
          path: SAF-MultiCopy.apk

      # Download link that always points to the newest build:
      # https://github.com/<owner>/<repo>/releases/download/latest/SAF-MultiCopy.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SAF-MultiCopy.apk \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built automatically from main. Open this page on your phone, tap SAF-MultiCopy.apk, then install." \
            --target "$GITHUB_SHA" \
            --latest
